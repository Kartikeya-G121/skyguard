; PlatformIO build for the SkyGuard demo node, so Wokwi for VS Code can
; simulate it locally and you never wait on wokwi.com's build queue again.
;
;   pio run                            build it
;   F1 -> "Wokwi: Start Simulator"     run it against diagram.json
;
; src_dir points at this folder rather than a src/ subdirectory, so sketch.ino
; stays the single copy shared with the wokwi.com route. Nothing is duplicated
; and the two paths cannot drift apart.

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    256dpi/MQTT@^2.5.3
    beegee-tokyo/DHT sensor library for ESPx@^1.19

; The Arduino core's own logging would interleave with the protocol trace and
; make the serial monitor unreadable on camera.
build_flags =
    -DCORE_DEBUG_LEVEL=0
